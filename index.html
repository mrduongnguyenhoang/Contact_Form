<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-container">
        <h1>Get in Touch</h1>
        <p class="subtitle">Fill out the form below to contact us</p>

        <form id="contactForm">
            <div class="form-grid">
                <div class="input-group">
                    <i class="fa-solid fa-user icon"></i>
                    <input type="text" id="name" placeholder="Name" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope icon"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-phone icon"></i>
                    <input type="tel" id="phone" placeholder="Phone">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-tag icon"></i>
                    <input type="text" id="subject" placeholder="Subject" required>
                </div>
            </div>

            <div class="input-group textarea-group">
                <i class="fa-solid fa-comment-dots icon"></i>
                <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> Send Message
            </button>
        </form>

        <hr class="divider">

        <div class="contact-info">
            <p><i class="fa-solid fa-location-dot"></i> 123 Main Street, City, Country</p>
            <p><i class="fa-solid fa-envelope"></i> contact@example.com</p>
            <p><i class="fa-solid fa-square-phone"></i> +1 234 567 8900</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
